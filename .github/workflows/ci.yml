name: CI Pipeline - Code Quality & Load Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:

  # 1) Lint - ESLint
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # 2) Unit Test - Jest (dengan coverage)
  unit_test:
    name: Unit Test (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest with coverage
        run: npm test

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # 3) SonarQube Scan (SonarCloud)
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: [lint, unit_test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage (for Sonar)
        run: npm test

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # 4) k6 Smoke Test (opsional - dijalankan di CI)
  k6_smoke_test:
    name: k6 Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, unit_test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start app in background
        run: |
          nohup npm start > app.log 2>&1 &
          disown
        env:
          PORT: 3000

      - name: Wait for app to be ready
        run: npx wait-on http://localhost:3000/ --timeout 30000

      - name: Run k6 smoke test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: loadtest/script.js
        env:
          BASE_URL: http://localhost:3000

      - name: Show app logs (debug)
        if: always()
        run: cat app.log || true